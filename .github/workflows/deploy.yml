name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-rald-realtime
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers (realtime.rald.cloud)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Resolve KV namespace IDs via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node << 'JSEOF'
          const fs = require('fs');
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const h = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
          const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}/storage/kv/namespaces`;
          async function listAll() { const r = await fetch(`${base}?per_page=100`, { headers: h }); const d = await r.json(); if (!d.success) throw new Error(JSON.stringify(d.errors)); return d.result; }
          async function resolveId(title) {
            const all = await listAll();
            const e = all.find(n => n.title === title);
            if (e) { console.log(`  [existing] ${title}`); return e.id; }
            const r = await fetch(base, { method: 'POST', headers: h, body: JSON.stringify({ title }) });
            const d = await r.json();
            if (!d.success) { const retry = (await listAll()).find(n => n.title === title); if (retry) return retry.id; throw new Error(JSON.stringify(d.errors)); }
            console.log(`  [created]  ${title}`); return d.result.id;
          }
          (async () => {
            const RATE_LIMIT_KV  = await resolveId('rald-realtime-rate-limit');
            const HEALTH_KV      = await resolveId('rald-realtime-health');
            const PROVIDER_STATE_KV = await resolveId('rald-realtime-state');
            let toml = fs.readFileSync('wrangler.toml', 'utf8');
            toml = toml.replace('REPLACE_WITH_RATE_LIMIT_KV_ID', RATE_LIMIT_KV);
            toml = toml.replace('REPLACE_WITH_HEALTH_KV_ID', HEALTH_KV);
            toml = toml.replace('REPLACE_WITH_PROVIDER_STATE_KV_ID', PROVIDER_STATE_KV);
            fs.writeFileSync('wrangler.toml', toml);
            console.log('wrangler.toml patched with all 3 KV IDs.');
          })().catch(e => { console.error(e); process.exit(1); });
          JSEOF
      - name: Deploy rald-realtime Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Push RALD_JWT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RALD_JWT_SECRET: ${{ secrets.RALD_JWT_SECRET }}
        run: |
          if [ -z "$RALD_JWT_SECRET" ]; then echo "FATAL: RALD_JWT_SECRET not set" && exit 1; fi
          echo "$RALD_JWT_SECRET" | npx wrangler secret put RALD_JWT_SECRET --name rald-realtime && echo "pushed"
      - name: Push SUPABASE_SERVICE_ROLE_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "FATAL: SUPABASE_SERVICE_ROLE_KEY not set" && exit 1; fi
          echo "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name rald-realtime && echo "pushed"
      - name: Push optional provider secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TENCENT_SDK_APP_ID: ${{ secrets.TENCENT_SDK_APP_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          CALLS_APP_SECRET: ${{ secrets.CALLS_APP_SECRET }}
        run: |
          if [ -n "$TENCENT_SDK_APP_ID" ]; then
            echo "$TENCENT_SDK_APP_ID" | npx wrangler secret put TENCENT_SDK_APP_ID --name rald-realtime
            echo "$TENCENT_SECRET_KEY" | npx wrangler secret put TENCENT_SECRET_KEY --name rald-realtime
            echo "Tencent secrets pushed"
          fi
          if [ -n "$CALLS_APP_SECRET" ]; then
            echo "$CALLS_APP_SECRET" | npx wrangler secret put CALLS_APP_SECRET --name rald-realtime
            echo "CALLS_APP_SECRET pushed"
          fi
