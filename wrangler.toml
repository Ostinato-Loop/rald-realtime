name = "rald-realtime"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = []

[vars]
ENVIRONMENT = "production"
RALD_AUTH_URL = "https://auth.rald.cloud"

[[routes]]
pattern = "realtime.rald.cloud/*"
zone_name = "rald.cloud"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_RATE_LIMIT_KV_ID"

[[kv_namespaces]]
binding = "HEALTH_KV"
id = "REPLACE_WITH_HEALTH_KV_ID"

[[kv_namespaces]]
binding = "PROVIDER_STATE_KV"
id = "REPLACE_WITH_PROVIDER_STATE_KV_ID"

[build]
command = ""

[observability]
enabled = true
head_sampling_rate = 1
