name = "rald-realtime"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = []

[vars]
ENVIRONMENT = "production"
RALD_AUTH_URL = "https://auth.rald.cloud"

# Secrets — set via: wrangler secret put <NAME>
# Required:
#   RALD_JWT_SECRET
#   SUPABASE_URL (org secret)
#   SUPABASE_SERVICE_ROLE_KEY (org secret)
# Optional (provider-specific):
#   CALLS_APP_ID, CALLS_APP_SECRET    — Cloudflare Calls
#   LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET
#   TENCENT_SDK_APP_ID, TENCENT_SECRET_KEY

[[routes]]
pattern = "realtime.rald.cloud/*"
zone_name = "rald.cloud"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_RATE_LIMIT_KV_ID"

[[kv_namespaces]]
binding = "HEALTH_KV"
id = "REPLACE_WITH_HEALTH_KV_ID"

[[kv_namespaces]]
binding = "PROVIDER_STATE_KV"
id = "REPLACE_WITH_PROVIDER_STATE_KV_ID"

[build]
command = ""

[observability]
enabled = true
head_sampling_rate = 1
